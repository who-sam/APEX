# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploys the apex backend as a Docker web service on Render's free tier.
# Postgres is NOT provisioned here — point DATABASE_URL at a Neon project
# (https://neon.tech). Free Render Postgres is 30-day only; Neon is permanent.
#
# After connecting this repo in the Render dashboard, set the secret env vars
# (marked `sync: false`) under the service's Environment tab.
services:
  - type: web
    name: apex-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    # Schema migrations run inside the app on startup (see
    # internal/database/sqlmigrate.go). Render free tier does not allow a
    # separate preDeployCommand, so we fold it into the binary.
    envVars:
      - key: PORT
        value: "8080"
      - key: SKIP_AUTOMIGRATE
        value: "true"
      - key: JUDGE0_URL
        value: https://ce.judge0.com
      # ---- secrets / per-env values: set in Render dashboard ----
      - key: DATABASE_URL
        sync: false   # paste from Neon: postgres://user:pass@ep-xxx.neon.tech/apex?sslmode=require
      - key: JWT_SECRET
        sync: false   # >= 32 random chars
      - key: APP_URL
        sync: false   # https://<your-site>.netlify.app
      - key: ALLOWED_ORIGINS
        sync: false   # https://<your-site>.netlify.app,https://deploy-preview-*--<your-site>.netlify.app
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-apex}
    ports:
      # Host 5433 → container 5432 (host 5432 often taken by local postgres).
      # Backend talks via internal network on 5432 regardless.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-apex}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
    entrypoint: ["/app/migrate", "up"]
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-apex}
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET}
      MIGRATIONS_DIR: file:///app/internal/database/migrations/sql
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-apex}
      DB_SSLMODE: disable
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET}
      JUDGE0_URL: ${JUDGE0_URL:-https://ce.judge0.com}
      APP_URL: ${APP_URL:-http://localhost:8081}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8081,http://localhost}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Distroless image has no shell/curl — use a TCP probe via /proc.
      test: ["CMD", "/app/apex", "--healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_GITHUB_URL: ${VITE_GITHUB_URL:-}
        VITE_CONTACT_EMAIL: ${VITE_CONTACT_EMAIL:-}
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  pgdata:
